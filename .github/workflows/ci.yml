name: CI

# Chạy mỗi khi push lên bất kỳ branch + mỗi khi mở/cập nhật pull request vào main.
# Nếu fail → nút Merge bị xám trên PR → không merge code gãy vào main được.
on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main]

# Huỷ run cũ khi push commit mới trên cùng branch → tiết kiệm phút runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-test:
    # Test SQL function plpgsql (recalc_chi_phi_payment_status — nguồn chân lý
    # cho status thanh toán chi phí). Postgres container thuần, không cần
    # Supabase auth/RLS vì hàm không phụ thuộc auth.uid().
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Load schema (subset tables hàm đọc/ghi)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/recalc_chi_phi_payment_status/schema.sql

      - name: Load function (bản định nghĩa recalc_chi_phi_payment_status)
        # File 20261003b là migration CUỐI CÙNG viết trọn thân hàm
        # recalc_chi_phi_payment_status: bản prod (có guard is_tk_chi_xem — schema
        # test stub guard = false) + khóa dòng trước khi tính.
        # Sửa lại thân hàm ở migration nào thì phải trỏ dòng dưới (và bước load
        # recalc của bộ dinh_ky_don_phan_du bên dưới) sang file đó.
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261003b_recalc_khoa_dong_truoc.sql

      - name: Run tests
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/recalc_chi_phi_payment_status/test.sql

      # ── create_lead_from_form ────────────────────────────────────────────
      # Endpoint GHI công khai (anon gọi được) → cap độ dài + rate-limit là
      # rào chắn duy nhất. Dùng chung container; bảng của 2 bộ test không trùng tên.
      - name: Load schema (create_lead_from_form)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/create_lead_from_form/schema.sql

      - name: Load function (create_lead_from_form)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260720_harden_create_lead_from_form.sql

      - name: Run tests (create_lead_from_form)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/create_lead_from_form/test.sql

      # ── dinh_ky_don_phan_du ──────────────────────────────────────────────
      # Trigger tự dồn phần ĐNTT định kỳ vượt chi phí (tiền thật của NCC). Database
      # RIÊNG: bảng trùng tên với bộ recalc nhưng nhiều cột hơn. seed_lech nạp TRƯỚC
      # migration để test cả bước dọn dữ liệu (bước 4) của migration.
      - name: Create database (dinh_ky_don_phan_du)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE dinh_ky_test"

      - name: Load schema + recalc + seed + migration (dinh_ky_don_phan_du)
        env:
          PGURL_DK: postgres://postgres:test@localhost:5432/dinh_ky_test
        run: |
          psql "$PGURL_DK" -v ON_ERROR_STOP=1 -f supabase/tests/dinh_ky_don_phan_du/schema.sql
          psql "$PGURL_DK" -v ON_ERROR_STOP=1 -f supabase/migrations/20261003b_recalc_khoa_dong_truoc.sql
          psql "$PGURL_DK" -v ON_ERROR_STOP=1 -f supabase/tests/dinh_ky_don_phan_du/seed_lech.sql
          psql "$PGURL_DK" -v ON_ERROR_STOP=1 -f supabase/migrations/20261003_dinh_ky_don_phan_du.sql

      - name: Run tests (dinh_ky_don_phan_du)
        env:
          PGURL_DK: postgres://postgres:test@localhost:5432/dinh_ky_test
        run: psql "$PGURL_DK" -v ON_ERROR_STOP=1 -f supabase/tests/dinh_ky_don_phan_du/test.sql

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (lockfile)
        run: npm ci

      - name: Typecheck (tsc -b)
        # tsc -b đi theo project references (tsconfig.app + tsconfig.node).
        # KHÔNG dùng `-p tsconfig.json` vì file đó có "files": [] → check 0 file.
        run: npx tsc -b

      - name: Lint (eslint)
        # Chỉ FAIL khi có error (rules-of-hooks, lỗi nghiêm trọng...). ~760 warning
        # (no-explicit-any, exhaustive-deps) vẫn cho qua — dọn dần kiểu boy-scout.
        run: npm run lint

      - name: Unit test (vitest)
        run: npm test

      - name: Build
        run: npm run build
