name: Backup Supabase Storage

# Sao lưu FILE trong Supabase Storage (hóa đơn/UNC/ảnh) lên Google Drive — phần
# mà pg_dump KHÔNG có (dump chỉ chứa metadata, không có nội dung file).
#
# Cơ chế: rclone copy (CHỈ THÊM, không xoá) từ Supabase (S3 endpoint) → Google Drive.
# Dùng `copy` chứ KHÔNG `sync`: nếu file bị xoá/hack ở Supabase, bản backup vẫn giữ.
#
# YÊU CẦU: 1 secret repo `RCLONE_CONF` = nội dung file rclone.conf có 2 remote:
#   [supabase]  type=s3 (Supabase Storage S3 access key, force_path_style=true)
#   [gdrive]    type=drive (OAuth token tài khoản Google của bạn)
# Xem hướng dẫn tạo trong scripts/README-backup.md.

on:
  schedule:
    - cron: "0 20 * * 6" # 20:00 UTC thứ 7 = 03:00 CN giờ VN (hằng tuần)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup-storage
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Cài rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Ghi cấu hình rclone từ secret
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::Thiếu secret RCLONE_CONF — xem scripts/README-backup.md."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "Remotes có trong config:"
          rclone listremotes

      - name: Copy file Storage → Google Drive (chỉ thêm, không xoá)
        run: |
          set -e
          DEST_ROOT="gdrive:s8-supabase-backup"
          for b in dntt-documents doan-files web-images; do
            echo "=== Bucket: $b ==="
            rclone copy "supabase:$b" "$DEST_ROOT/$b" \
              --transfers=8 --checkers=16 --stats=15s --stats-one-line -v
          done
          echo "✓ Hoàn tất copy Storage → Google Drive"
