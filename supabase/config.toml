project_id = "lflsbwoqzmbknzdpaequ"

# sync-chi-phi-to-sheet được gọi bởi pg_cron (không có user JWT) → tắt verify_jwt.
# Bảo vệ bằng header 'x-cron-secret' khớp env CHI_PHI_CRON_SECRET (xem index.ts).
[functions.sync-chi-phi-to-sheet]
verify_jwt = false

# sync-su-co-to-sheet cũng được gọi bởi pg_cron → tắt verify_jwt.
# Bảo vệ bằng header 'x-cron-secret' khớp env SU_CO_CRON_SECRET (xem index.ts).
[functions.sync-su-co-to-sheet]
verify_jwt = false

# send-push duoc goi boi trigger pg_net tren INSERT thong_bao (khong co user JWT)
# -> tat verify_jwt. Bao ve bang header 'x-push-secret' khop env PUSH_WEBHOOK_SECRET.
[functions.send-push]
verify_jwt = false

# fb-lead-webhook được Facebook gọi (không có user JWT) → tắt verify_jwt.
# Nhận CẢ leadgen (Lead Ads) LẪN messages (Messenger) — Meta chỉ cho 1 callback
# URL cho object `page` nên mọi field cùng đổ về hàm này.
# Bảo vệ: FB_VERIFY_TOKEN (đăng ký) + chữ ký X-Hub-Signature-256 (FB_APP_SECRET).
[functions.fb-lead-webhook]
verify_jwt = false

# ── 4 hàm dưới đây ĐANG chạy verify_jwt = false trên prod nhưng TRƯỚC ĐÂY thiếu khai
# ở file này. Thiếu khai = `npx supabase functions deploy <tên>` dùng mặc định
# verify_jwt = TRUE và ÂM THẦM SIẾT hàm đang chạy → client gọi bằng publishable key
# `sb_publishable_…` (KHÔNG phải JWT) sẽ ăn 401 và tính năng chết ngay sau khi deploy.
# Khai ở đây để lệnh deploy giữ đúng trạng thái prod. Muốn siết verify_jwt thì phải
# sửa cả phía client trước — xem ghi chú "Edge fn verify_jwt deferred".

# send-booking-email: mọi luồng gửi mail (booking KS/NH/DV, lock phòng, UNC, lead).
# Từ 13/08/2026 client gọi bằng access token của phiên đăng nhập (lib/edge-fn-auth.ts)
# nên bật verify_jwt. ĐỪNG hạ về false: hàm này gửi mail dưới tên miền công ty,
# để mở là ai cũng gửi được mail mạo danh.
[functions.send-booking-email]
verify_jwt = true

# ai-chat: ĐÃ GỠ 13/08/2026. Hàm trợ lý AI cũ không xác thực người gọi và nạp
# thẳng dữ liệu danh mục vào prompt, trong khi màn hình gọi nó đã bỏ từ lâu.
# ĐỪNG khai lại tên này. Muốn làm trợ lý AI thì viết hàm mới: bắt buộc xác thực,
# whitelist đúng cột được phép đọc, và không đưa dữ liệu giá vốn vào prompt.

# extract-chuong-trinh: trích lịch trình từ file OP tải lên, gọi bằng publishable key.
[functions.extract-chuong-trinh]
verify_jwt = false

# notify: điểm nhận thông báo, gọi không kèm user JWT.
[functions.notify]
verify_jwt = false

# push-portal: đẩy báo giá + chương trình đoàn sang project cổng đối tác (外網).
# pg_cron gọi 30 phút/lần nên không có user JWT → verify_jwt = false.
# Bảo vệ: header 'x-portal-secret' khớp env PORTAL_CRON_SECRET, HOẶC access token
# của phiên đăng nhập (nút "Đẩy ngay" trong CRM). Xem index.ts.
[functions.push-portal]
verify_jwt = false

# trao-doi: hỏi/đáp giữa OP và đối tác trên cổng 外網.
# Cổng gọi sang bằng 'x-portal-secret' (không có JWT của CRM) nên verify_jwt=false;
# chiều OP thì hàm tự kiểm access token. Xem index.ts.
[functions.trao-doi]
verify_jwt = false

# yeu-cau-doi-tac: đối tác gửi yêu cầu báo giá từ cổng 外網 → lead bên CRM.
# Chỉ cổng gọi, bằng 'x-portal-secret' khớp PORTAL_TRAO_DOI_SECRET (không có JWT
# của CRM) → verify_jwt = false. Xem index.ts.
[functions.yeu-cau-doi-tac]
verify_jwt = false
