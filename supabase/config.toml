# sync-chi-phi-to-sheet được gọi bởi pg_cron (không có user JWT) → tắt verify_jwt.
# Bảo vệ bằng header 'x-cron-secret' khớp env CHI_PHI_CRON_SECRET (xem index.ts).
[functions.sync-chi-phi-to-sheet]
verify_jwt = false

# sync-su-co-to-sheet cũng được gọi bởi pg_cron → tắt verify_jwt.
# Bảo vệ bằng header 'x-cron-secret' khớp env SU_CO_CRON_SECRET (xem index.ts).
[functions.sync-su-co-to-sheet]
verify_jwt = false

# send-push duoc goi boi trigger pg_net tren INSERT thong_bao (khong co user JWT)
# -> tat verify_jwt. Bao ve bang header 'x-push-secret' khop env PUSH_WEBHOOK_SECRET.
[functions.send-push]
verify_jwt = false

# fb-lead-webhook được Facebook gọi (không có user JWT) → tắt verify_jwt.
# Bảo vệ: FB_VERIFY_TOKEN (đăng ký) + chữ ký X-Hub-Signature-256 (FB_APP_SECRET).
[functions.fb-lead-webhook]
verify_jwt = false
